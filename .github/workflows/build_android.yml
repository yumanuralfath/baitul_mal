name: Build Android Release

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Trigger manual

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0" # Flutter 3.29.0 menggunakan Dart 3.7.0, cukup untuk flutter_lints 6.0.0
          channel: "stable"
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Verify Dart SDK version
        run: dart --version

      - name: Get Flutter dependencies
        run: flutter pub get

      # Opsional: Analisis kode untuk deteksi dini error
      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      # ----- SIGNING (JIKA MENGGUNAKAN KEYSTORE DARI SECRET) -----
      # Uncomment dan isi secret berikut di repo Settings > Secrets:
      # - KEYSTORE_BASE64 : file .jks yang diencode base64
      # - KEYSTORE_PASSWORD
      # - KEY_PASSWORD
      # - KEY_ALIAS
      #
      # - name: Decode keystore
      #   run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
      #
      # - name: Create key.properties
      #   run: |
      #     echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
      #     echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
      #     echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
      #     echo "storeFile=../app/upload-keystore.jks" >> android/key.properties

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: baitul-mal-plus-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: baitul-mal-plus-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
